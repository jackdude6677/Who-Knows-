<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>WHO KNOWS?</title>
<meta name="description" content="A one-phone party game of secrets, bluffing, and deduction.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#100E1B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#100E1B;
  --bg-2:#171429;
  --card:#1E1A33;
  --card-2:#251F40;
  --line:#332C55;
  --violet:#7C5CFC;
  --violet-2:#9B82FF;
  --coral:#FF5D73;
  --teal:#2DD4A7;
  --amber:#FFB020;
  --ink:#F3F0FF;
  --ink-dim:#B6ADD6;
  --ink-faint:#7A709E;
  --radius:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(circle at 15% -10%, #2A2350 0%, transparent 55%),
    radial-gradient(circle at 110% 10%, #351E3E 0%, transparent 45%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
#app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:calc(20px + var(--safe-t)) 18px calc(20px + var(--safe-b));
  max-width:520px;
  margin:0 auto;
  position:relative;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
button:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--violet-2);outline-offset:3px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.screen{display:flex;flex-direction:column;flex:1;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet-2);font-weight:700;margin-bottom:6px;
}
.title{font-size:28px;font-weight:700;line-height:1.1;margin:0 0 6px;}
.sub{color:var(--ink-dim);font-size:15px;line-height:1.5;margin:0 0 20px;}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px 20px;border-radius:18px;
  font-size:17px;font-weight:700;font-family:'Space Grotesk',sans-serif;
  transition:transform .12s ease, filter .12s ease;
  min-height:58px;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--violet),#5C3FE0);color:white;box-shadow:0 10px 30px -10px rgba(124,92,252,.6);}
.btn-secondary{background:var(--card);border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost{background:transparent;color:var(--ink-dim);font-weight:600;font-size:15px;padding:12px;min-height:auto;}
.btn-danger{background:linear-gradient(135deg,var(--coral),#D6415A);color:white;}
.btn-sm{padding:12px 16px;font-size:14px;min-height:44px;border-radius:14px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;gap:10px;}
.grow{flex:1;}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;min-height:32px;}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-dim);}

/* cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}
.card-glow{box-shadow:0 20px 60px -25px rgba(124,92,252,.5);}

/* Player list rows */
.player-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:white;
  background:linear-gradient(135deg,var(--av1,var(--violet)),var(--av2,var(--coral)));
}
.player-name-input{
  flex:1;background:transparent;border:none;color:var(--ink);
  font-size:16px;font-weight:600;font-family:inherit;min-width:0;
}
.player-name-input:focus{outline:none;}
.player-name-input::placeholder{color:var(--ink-faint);}
.chip{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;
  background:rgba(124,92,252,.18);color:var(--violet-2);letter-spacing:.04em;
}

/* mode select cards */
.mode-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:16px 16px;display:flex;gap:14px;align-items:center;text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.mode-card.selected{border-color:var(--violet);background:var(--card-2);}
.mode-emoji{font-size:28px;width:44px;text-align:center;flex-shrink:0;}
.mode-name{font-weight:700;font-size:16px;font-family:'Space Grotesk',sans-serif;}
.mode-desc{font-size:13px;color:var(--ink-dim);margin-top:2px;line-height:1.4;}

/* pass phone screen */
.pass-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;}
.pass-icon{font-size:56px;animation:float 2.4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pass-name{font-size:40px;font-weight:700;font-family:'Space Grotesk',sans-serif;
  background:linear-gradient(135deg,var(--violet-2),var(--coral));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.pass-hint{color:var(--ink-dim);font-size:14px;max-width:280px;line-height:1.5;}

/* hold to reveal */
.hold-btn{
  position:relative;width:180px;height:180px;border-radius:50%;
  background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:15px;
  color:var(--ink-dim);overflow:hidden;user-select:none;
}
.hold-btn svg{position:absolute;inset:0;transform:rotate(-90deg);}
.hold-btn circle{fill:none;stroke-width:6;}
.hold-btn .bg-ring{stroke:var(--line);}
.hold-btn .fg-ring{stroke:var(--violet-2);stroke-linecap:round;transition:stroke-dashoffset .05s linear;}
.hold-btn.active{color:var(--ink);}
.hold-label{position:relative;z-index:2;pointer-events:none;padding:0 20px;}

.secret-panel{
  width:100%;background:var(--card-2);border:1.5px solid var(--violet);
  border-radius:20px;padding:22px 20px;min-height:140px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
  animation:revealPop .25s ease;
}
.secret-panel.warn{border-color:var(--coral);background:rgba(255,93,115,.08);}
.secret-panel.warn .secret-tag{color:var(--coral);}
@keyframes revealPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.secret-tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--violet-2);}
.secret-body{font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1.3;}
.secret-note{font-size:13px;color:var(--ink-dim);margin-top:4px;line-height:1.4;}

/* discussion / timer */
.timer-ring-wrap{position:relative;width:230px;height:230px;margin:10px auto;}
.timer-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.timer-ring-wrap circle{fill:none;stroke-width:10;}
.timer-bg{stroke:var(--card-2);}
.timer-fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-num{font-size:44px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.timer-label{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
.timer-fg.warn{stroke:var(--amber);}
.timer-fg.crit{stroke:var(--coral);}

.banner{
  background:var(--card-2);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;font-size:14px;color:var(--ink-dim);text-align:center;line-height:1.5;
}
.banner b{color:var(--ink);}

/* vote list */
.vote-option{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px;font-size:16px;font-weight:600;text-align:left;
}
.vote-option.chosen{border-color:var(--coral);background:var(--card-2);}
.vote-option .avatar{margin-right:2px;}

/* results */
.result-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.result-bar-bg{flex:1;height:10px;border-radius:6px;background:var(--card-2);overflow:hidden;}
.result-bar-fg{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--coral));}

.tag-truth{display:inline-block;background:rgba(45,212,167,.16);color:var(--teal);font-weight:700;font-size:12px;padding:5px 10px;border-radius:20px;margin-bottom:8px;}
.tag-target{display:inline-block;background:rgba(255,93,115,.16);color:var(--coral);font-weight:700;font-size:12px;padding:5px 10px;border-radius:20px;}

.scoreboard-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.scoreboard-row:last-child{border-bottom:none;}
.score-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--violet-2);min-width:34px;text-align:right;}

.footer-nav{display:flex;gap:10px;margin-top:16px;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:9px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-dim);
}
.pill.active{border-color:var(--violet);color:var(--ink);background:var(--card-2);}

.badge-earn{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;}
.stat-num{font-size:24px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--violet-2);}
.stat-label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

.tutorial-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;}
.tut-emoji{font-size:52px;}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--violet-2);width:20px;border-radius:4px;}

.spice-flash{
  position:fixed;inset:0;background:rgba(16,14,27,.92);z-index:50;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px;
  animation:fadeIn .25s ease;
}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= AUDIO ============================= */
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq=440,dur=.12,type='sine',vol=.12,delay=0){
  if(!settings.sound) return;
  ensureAudio(); if(!audioCtx) return;
  const t0=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+.02);
}
const sfx={
  flip:()=>{beep(520,.09,'triangle',.1); beep(760,.09,'triangle',.09,.05);},
  reveal:()=>beep(660,.18,'sine',.13),
  tick:()=>beep(880,.03,'square',.03),
  lock:()=>{beep(300,.08,'square',.1); beep(200,.1,'square',.09,.06);},
  dramatic:()=>{beep(220,.3,'sawtooth',.08); beep(330,.3,'sawtooth',.07,.15); beep(440,.4,'sawtooth',.08,.3);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.15,'triangle',.1,i*.09));},
  wrong:()=>{beep(200,.25,'sawtooth',.1); beep(150,.3,'sawtooth',.09,.1);},
};

/* ============================= STATE ============================= */
let settings = JSON.parse(localStorage.getItem('wk_settings')||'{}');
if(settings.sound===undefined) settings.sound=true;
if(settings.categoryHints===undefined) settings.categoryHints=true;
function saveSettings(){ localStorage.setItem('wk_settings',JSON.stringify(settings)); }

let stats = JSON.parse(localStorage.getItem('wk_stats')||'null') || {
  gamesPlayed:0, roundsPlayed:0, correctAccusations:0, successfulBluffs:0,
  timesVotedOut:0, bestStreak:0, curStreak:0
};
function saveStats(){ localStorage.setItem('wk_stats',JSON.stringify(stats)); }

let recentRounds = JSON.parse(localStorage.getItem('wk_recent')||'[]');
function pushRecent(sig){ recentRounds.unshift(sig); recentRounds=recentRounds.slice(0,60); localStorage.setItem('wk_recent',JSON.stringify(recentRounds)); }
function isRecent(sig){ return recentRounds.includes(sig); }

const S = {
  screen:'menu',
  players:[], // {id,name}
  chaosLevel:'normal', // low/normal/chaos
  discussionSeconds:180,
  selectedMode:null, // null = quick play (auto)
  revealIndex:0,
  revealed:{}, // id -> true once shown
  round:null, // current generated round
  twist:null,
  votes:{}, // voterId -> targetId
  voteIndex:0,
  score:{}, // playerId -> points this session
  tutIndex:0,
  holding:false,
  spiceMsg:null,
  redemptionQueue:[], redemptionIndex:0, redemptionChoice:null, redemptionRevealed:false,
  wlGuess:null, wlScored:false, wlRevealedNow:false, wlHoldDone:false,
  wlLastGuesserId:null, // tracks rotation so the same player never guesses twice in a row
};

function uid(){ return Math.random().toString(36).slice(2,9); }
const AVATAR_PAIRS=[['#7C5CFC','#FF5D73'],['#2DD4A7','#7C5CFC'],['#FFB020','#FF5D73'],['#FF5D73','#7C5CFC'],['#2DD4A7','#FFB020'],['#9B82FF','#2DD4A7']];
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ============================= ROUND GENERATORS ============================= */
function pickUnique(pool, sigPrefix){
  let tries=0, item;
  do{ item=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(isRecent(sigPrefix+'|'+ (item.truth||item.title||item.label)) && tries<pool.length*2);
  pushRecent(sigPrefix+'|'+(item.truth||item.title||item.label));
  return item;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function genSecretRound(players){
  // Pick one word, avoiding recent repeats. With ~1900 words this rarely collides.
  let cat, word, sig, tries=0;
  do{
    cat = WORD_BANK[Math.floor(Math.random()*WORD_BANK.length)];
    word = cat.words[Math.floor(Math.random()*cat.words.length)];
    sig = 'secret|'+word;
    tries++;
  } while(isRecent(sig) && tries<50);
  pushRecent(sig);

  const order = shuffle(players);
  const n = order.length;
  // Everyone knows the same word except 1 (or occasionally more, at higher chaos) blank player(s).
  let blankCount = 1;
  if(S.chaosLevel==='chaos') blankCount = Math.max(1, Math.floor(n/5));
  else if(S.chaosLevel==='normal' && n>=8) blankCount = 2;
  blankCount = Math.min(blankCount, Math.max(1, n-2)); // always leave at least 2 players who know it

  const blanks = order.slice(0, blankCount).map(p=>p.id);
  const info = {};
  order.forEach(p=>{
    if(blanks.includes(p.id)){
      info[p.id] = {title:"⚠️ You're the Blank", body:'???', note:'You don\'t know the word — everyone else secretly knows the same one. Listen closely, ask vague questions, and bluff your way through without getting caught.'};
    } else {
      info[p.id] = {title:'Your secret word:', body: word, note:'Talk about it — describe it, ask about it — but never say the word itself. Try to spot whoever doesn\'t actually know it.'};
    }
    if(settings.categoryHints){ info[p.id].category = cat.name; }
  });
  const plural = blanks.length>1;
  const catWords = cat.words.filter(w=>w!==word);
  const decoyPool = catWords.length>=3 ? catWords : WORD_BANK.flatMap(c=>c.words).filter(w=>w!==word);
  const decoys = shuffle(decoyPool).slice(0,3);
  return {
    mode:'secret', category:cat.name, truthLabel:word,
    info, targets:blanks, targetLabel: plural ? 'the players who didn\'t know the word' : 'the player who didn\'t know the word',
    revealNote:`The secret word was "${word}" (${cat.name}).`,
    hint:`Everyone except ${plural? blanks.length+' players' : 'one player'} knows the same secret word. Talk about it without ever saying it out loud — the blank player has to bluff and guess it purely from context.`,
    redemption: { question:'If caught, quick — what was the secret word?', correct: word, options: shuffle([word, ...decoys]) },
  };
}

function genWerewolfRound(players){
  const n = players.length;
  const order = shuffle(players);
  const ww = n<=5 ? 1 : (n<=9 ? 2 : 3);
  // Deck always has n+3 cards: the extra 3 sit face-down "in the middle" and belong to nobody.
  // Seer/Robber/Troublemaker are always in the deck (even in tiny games) so there's always real
  // info and real swaps to reason about. We deliberately weight the deal so a Werewolf lands
  // on a player ~80% of the time — a peaceful night (no Werewolf in play) is the rare twist,
  // not a coin flip.
  const deckSize = n+3;
  const wolfCards = Array(ww).fill('Werewolf');
  let base = ['Seer','Robber','Troublemaker']; // everything except Werewolf cards
  const villagerCount = Math.max(0, deckSize - ww - base.length);
  for(let i=0;i<villagerCount;i++) base.push('Villager');
  base = shuffle(base);

  const wolfInPlay = Math.random() < 0.8;
  let center, playerPool;
  if(wolfInPlay){
    center = base.slice(0,3);
    playerPool = shuffle([...base.slice(3), ...wolfCards]);
  } else {
    const fillCount = Math.max(0, 3-ww);
    center = shuffle([...wolfCards, ...base.slice(0,fillCount)]);
    playerPool = shuffle(base.slice(fillCount));
  }

  const originalRoles = {}, currentRoles = {};
  order.forEach((p,i)=>{ originalRoles[p.id]=playerPool[i]; currentRoles[p.id]=playerPool[i]; });

  const byRole = r => order.filter(p=>originalRoles[p.id]===r).map(p=>p.id);
  const passOrder = [...byRole('Werewolf'), ...byRole('Seer'), ...byRole('Robber'), ...byRole('Troublemaker'), ...shuffle(byRole('Villager'))];

  const info = {};
  byRole('Villager').forEach(id=>{
    info[id] = {title:'Your role: VILLAGER', body:'You have no special power.', note:'Just listen carefully and vote based on what people say and do.'};
  });

  return {
    mode:'werewolf', category:'Village', truthLabel:'One Night',
    info, targets:[], targetLabel: ww>1 ? 'the Werewolves' : 'the Werewolf',
    allowSkipVote:true, wwDeckCount:ww,
    revealNote:'', hint:`Everyone was secretly dealt one role, but 3 extra cards were left face-down in the middle that nobody holds. There ${ww>1?`are ${ww} Werewolf cards`:'is 1 Werewolf card'} in this game — most of the time it's in someone's hands, but every so often it's sitting in the middle instead. Some roles peeked at real info or swapped cards during the night, so what a player believes about themselves might already be out of date. Talk it out and decide: is there a Werewolf to catch, or was it a peaceful night?`,
    originalRoles, currentRoles, passOrder, nightLog:[], center, wolfCenterPeekIndex: Math.floor(Math.random()*3),
  };
}

function genMoleRound(players){
  const mission = pickUnique(MOLE_MISSIONS,'mole');
  const order = shuffle(players);
  const info={};
  const moleId = order[order.length-1].id;
  const innocents = order.slice(0,-1);
  const stepsShuffled = shuffle(mission.steps);
  innocents.forEach((p,i)=>{
    info[p.id] = {title:'Your step:', body: stepsShuffled[i % stepsShuffled.length], note:'This is one real step from a real everyday activity — everyone who isn\'t the Mole has one. Nobody\'s told what the activity is; figure it out together and try to put the steps in order.'};
  });
  info[moleId] = {title:'⚠️ You\'re the Mole', body:'You don\'t have a real step.', note:'Everyone else has one real step from the same everyday activity — you don\'t know what it is. Invent a plausible-sounding step and try not to give yourself away when the order doesn\'t add up.'};
  if(settings.categoryHints){ order.forEach(p=>{ info[p.id].category = mission.cat; }); }

  const decoyThemes = shuffle(MOLE_MISSIONS.filter(m=>m.theme!==mission.theme)).slice(0,2).map(m=>m.theme);
  return {
    mode:'mole', category:'Mission', truthLabel: mission.theme,
    info, targets:[moleId], targetLabel:'the Mole',
    revealNote:`The activity was: ${mission.theme}\n\nIn order: ${mission.steps.join(' → ')}`,
    hint:`Everyone except the Mole has one real step from the same everyday activity — nobody's told what it is up front. Share your steps, try to piece together the order, and figure out both what the activity is and who's faking their step.`,
    redemption: { question:'If caught, quick — what was the real activity?', correct: mission.theme, options: shuffle([mission.theme, ...decoyThemes]) },
  };
}

function genOddballRound(players){
  const set = pickUnique(ODDBALL_SETS,'odd');
  const order = shuffle(players);
  const info={};
  const oddId = order[order.length-1].id;
  const itemsShuffled = shuffle(set.items);
  order.forEach((p,i)=>{
    if(p.id===oddId){
      info[p.id] = {title:'⚠️ Your word (you\'re the odd one out)', body:set.odd, note:'You don\'t share the group\'s hidden category. Answer questions vaguely and try to blend in — never say your word out loud.'};
    } else {
      info[p.id] = {title:'Your secret word:', body: itemsShuffled[i % itemsShuffled.length], note:'Most players share a hidden category that connects their words. Never say your word out loud — describe it instead.'};
    }
  });
  const decoyCats = shuffle(ODDBALL_SETS.filter(s=>s.label!==set.label)).slice(0,2).map(s=>s.label);
  return {
    mode:'oddball', category:'Hidden Category', truthLabel: set.label,
    info, targets:[oddId], targetLabel:'the player whose word doesn\'t fit',
    revealNote:`The hidden category was: ${set.label}. The odd word was "${set.odd}."`,
    hint:`Everyone has a secret word. Most words fit a hidden category — nobody's been told what it is. Take turns asking each other indirect questions about your word (e.g. "would you find it in a store?", "is it alive?") without ever saying the word itself. Try to work out the category and spot whichever word doesn\'t belong.`,
    redemption: { question:'If caught, quick — what was the hidden category?', correct: set.label, options: shuffle([set.label, ...decoyCats]) },
  };
}

function genAlibiRound(players){
  const ev = pickUnique(ALIBI_EVENTS,'alibi');
  const order = shuffle(players);
  const info={};
  const guiltyId = order[order.length-1].id;
  const innocents = order.slice(0,-1);
  const roomAssignment = {};
  innocents.forEach(p=>{ roomAssignment[p.id] = ROOMS[Math.floor(Math.random()*ROOMS.length)]; });
  const secretsShuffled = shuffle(ev.secrets);
  innocents.forEach((p,i)=>{
    const others = innocents.filter(x=>x.id!==p.id);
    let sightingText = '';
    if(others.length){
      const seen = others[Math.floor(Math.random()*others.length)];
      sightingText = ` You also saw ${seen.name} in ${roomAssignment[seen.id]}.`;
    }
    const secret = secretsShuffled[i % secretsShuffled.length];
    info[p.id] = {title:'Your alibi:', body:`You were in ${roomAssignment[p.id]}.${sightingText}`, note:`You're also secretly ${secret}. It has nothing to do with the incident — but it looks bad if it comes out.`};
  });
  info[guiltyId] = {title:'⚠️ You\'re Guilty — No Alibi', body:`You ${ev.guiltyAction}.`, note:'You have no real alibi — invent a room you were in, and be ready if someone asks who else was around. Try not to contradict what others say.'};

  const witness = innocents[Math.floor(Math.random()*innocents.length)];
  const correctRoom = roomAssignment[witness.id];
  const decoyRooms = shuffle(ROOMS.filter(r=>r!==correctRoom)).slice(0,2);
  return {
    mode:'alibi', category:'The Incident', truthLabel: ev.title,
    info, targets:[guiltyId], targetLabel:'the guilty player',
    revealNote:`What happened: ${ev.title}\n\nWhere everyone really was: ${innocents.map(p=>`${p.name} — ${roomAssignment[p.id]}`).join(', ')}.`,
    hint:`Something happened. One player is guilty and has no real alibi — they'll have to invent a room on the spot. Everyone else really was somewhere, and some of them truthfully saw each other there. Ask where people were and who saw whom — real answers should line up with each other; a made-up one might not.`,
    redemption: { question:`If caught, quick — which room was ${witness.name} really in?`, correct: correctRoom, options: shuffle([correctRoom, ...decoyRooms]) },
  };
}

function nextWavelengthGuesser(players){
  // Rotate through players in a fixed order (their current list order) so nobody guesses
  // twice in a row and nobody gets skipped — e.g. 1,2,3,1,2,3... never 1,2,1,3.
  if(S.wlLastGuesserId){
    const idx = players.findIndex(p=>p.id===S.wlLastGuesserId);
    if(idx!==-1){ return players[(idx+1)%players.length]; }
  }
  return players[Math.floor(Math.random()*players.length)];
}

function genWavelengthRound(players){
  const guesser = nextWavelengthGuesser(players);
  S.wlLastGuesserId = guesser.id;
  const number = 1 + Math.floor(Math.random()*10);
  const info = {};
  players.forEach(p=>{
    if(p.id!==guesser.id){
      info[p.id] = {title:'The number is:', body: String(number), note:'Nothing else — just the number. When the Guesser asks a category, give an answer that fits this number from 1 (low) to 10 (high).'};
    }
  });
  const passOrder = shuffle(players.filter(p=>p.id!==guesser.id)).map(p=>p.id);
  const promptChoices = shuffle(CATEGORY_PROMPTS).slice(0,4);
  return {
    mode:'wavelength', category:'Wavelength', truthLabel: String(number),
    guesserId: guesser.id, number, info, passOrder, promptChoices, chosenPrompt:null,
  };
}

const GENERATORS = { secret:genSecretRound, werewolf:genWerewolfRound, mole:genMoleRound, oddball:genOddballRound, alibi:genAlibiRound, wavelength:genWavelengthRound };

function generateRound(){
  let modeId = S.selectedMode;
  if(!modeId){
    const pool = MODES.filter(m=>!m.excludeFromRandom).map(m=>m.id);
    modeId = pool[Math.floor(Math.random()*pool.length)];
  }
  const round = GENERATORS[modeId](S.players);
  round.modeName = MODES.find(m=>m.id===round.mode).name;
  // maybe attach a spice event (unused by wavelength, harmless either way)
  let spiceChance = S.chaosLevel==='low'?0.08 : S.chaosLevel==='chaos'?0.55 : 0.28;
  round.spice = Math.random()<spiceChance ? SPICE_EVENTS[Math.floor(Math.random()*SPICE_EVENTS.length)] : null;
  // a few conversation-starter prompts for modes with a discussion phase (not wavelength)
  if(round.mode!=='wavelength'){ round.discussionPrompts = shuffle(QUESTION_PROMPTS).slice(0,3); }
  return round;
}

function loadLastNames(){

  try{ localStorage.setItem('wk_last_names', JSON.stringify(S.players.map(p=>p.name))); }catch(e){}
}
function ensureMinPlayers(){
  if(S.players.length===0){
    const last = loadLastNames().filter(n=>n && n.trim());

  } else {
    // secret privacy screen with hold-to-reveal
    wrap.appendChild(el('div','eyebrow','🔒 Secret Info'));

    if(!S.revealedShown){
      const holdWrap = el('div'); holdWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px;';
      const hb = el('div','hold-btn');
      hb.innerHTML = `<svg viewBox="0 0 100 100"><circle class="bg-ring" cx="50" cy="50" r="44"></circle><circle class="fg-ring" cx="50" cy="50" r="44" stroke-dasharray="276" stroke-dashoffset="276"></circle></svg><div class="hold-label">HOLD TO<br>REVEAL</div>`;
      let holdTimer=null, startT=null; const DURATION=900;
      const ring = hb.querySelector('.fg-ring');
      function step(ts){
        if(!startT) startT=ts;
        const p = Math.min(1,(ts-startT)/DURATION);
        ring.setAttribute('stroke-dashoffset', 276*(1-p));
        if(p<1 && S.holding){ holdTimer=requestAnimationFrame(step); }
        else if(p>=1){ finishReveal(); }

      }
      function startHold(e){ e.preventDefault(); S.holding=true; hb.classList.add('active'); startT=null; holdTimer=requestAnimationFrame(step); }
      function endHold(){ if(!S.revealedShown){ S.holding=false; hb.classList.remove('active'); ring.setAttribute('stroke-dashoffset',276); cancelAnimationFrame(holdTimer);} }
      hb.addEventListener('touchstart',startHold,{passive:false});
      hb.addEventListener('touchend',endHold);
      hb.addEventListener('touchcancel',endHold);
      hb.addEventListener('mousedown',startHold);
      hb.addEventListener('mouseup',endHold);
      hb.addEventListener('mouseleave',endHold);
      holdWrap.appendChild(hb);

    wrap.appendChild(el('div','eyebrow','SEER'));
    wrap.appendChild(el('div','pass-hint','Choose what to look at. You only get one.'));
    const opt1 = el('button','btn btn-secondary','👤 View one player\'s role'); opt1.style.marginTop='8px';
    opt1.onclick=()=>{ sfx.tick(); S.wwStage='select'; S.wwSelected=[]; render(); };
    const opt2 = el('button','btn btn-secondary','🃏 View 2 cards from the middle'); opt2.style.marginTop='10px';
    opt2.onclick=()=>{
      sfx.tick();
      const round = S.round;
      const idxs = shuffle([0,1,2]).slice(0,2).sort((a,b)=>a-b);
      const roles = idxs.map(i=>round.center[i]);
      round.info[playerId] = {title:'Your role: SEER', body:`You peeked at two of the middle cards: ${roles[0].toUpperCase()} and ${roles[1].toUpperCase()}.`, note:'Those cards belong to nobody — but now you know two of the three things that never made it into play.'};
      S.wwStage='result'; render();
    };
    wrap.appendChild(opt1); wrap.appendChild(opt2);
  }
  else if(S.wwStage==='select'){
    const needCount = role==='Troublemaker' ? 2 : 1;
    const label = role==='Seer' ? 'Choose a player to secretly view their role.' : role==='Robber' ? 'Choose a player to swap roles with.' : 'Choose two players to secretly swap their roles.';
    wrap.appendChild(el('div','eyebrow', role.toUpperCase()));
    wrap.appendChild(el('div','pass-hint', label));
    const list = el('div','stack'); list.style.width='100%';
    S.players.filter(p=>p.id!==playerId).forEach((p,i)=>{
      const opt = el('button','vote-option'+(S.wwSelected.includes(p.id)?' chosen':''));
      opt.appendChild(avatarEl(p.name,i));
      const nm = el('div',null,p.name); nm.style.flex='1'; opt.appendChild(nm);
      if(S.wwSelected.includes(p.id)) opt.appendChild(el('div',null,'✓'));
      opt.onclick=()=>{
        sfx.tick();
        if(S.wwSelected.includes(p.id)){ S.wwSelected = S.wwSelected.filter(x=>x!==p.id); }
        else if(S.wwSelected.length<needCount){ S.wwSelected.push(p.id); }
        render();
      };
      list.appendChild(opt);
    });
    wrap.appendChild(list);
    const confirm = el('button','btn btn-danger', S.wwSelected.length===needCount? 'Confirm' : `Select ${needCount-S.wwSelected.length} more`);
    confirm.disabled = S.wwSelected.length!==needCount;
    confirm.style.marginTop='14px';
    confirm.onclick=()=>{
      sfx.lock();
      resolveWWAction(playerId, role, S.wwSelected);
      S.wwStage='result'; render();
    };
    wrap.appendChild(confirm);
  }
  else if(S.wwStage==='result'){
    const rinfo = round.info[playerId];
    const panel = el('div','secret-panel'+(role==='Werewolf'?' warn':''));
    panel.innerHTML = `<div class="secret-tag">${rinfo.title}</div><div class="secret-body" style="font-size:17px;">${rinfo.body}</div>${rinfo.note?`<div class="secret-note">${rinfo.note}</div>`:''}`;
    wrap.appendChild(panel);
    const done = el('button','btn btn-danger','Hide & Pass →'); done.style.marginTop='14px';
    done.onclick=()=>{ sfx.tick(); advanceWW(); };
    wrap.appendChild(done);
  }

  s.appendChild(wrap);
  app.appendChild(s);
};

function roleBlurb(role){
  if(role==='Werewolf') return 'You\'ll find out who else is a Werewolf next — or what you can see in the middle if you\'re alone.';
  if(role==='Seer') return 'You get to secretly view one other player\'s role, or peek at 2 cards from the middle.';
  if(role==='Robber') return 'You get to swap roles with another player, then see your new role.';
  if(role==='Troublemaker') return 'You get to blindly swap two other players\' roles.';
  return 'You have no special power tonight.';
}

function finalizeWerewolfInfo(playerId){
  const round = S.round;
  const fellow = S.players.filter(p=>p.id!==playerId && round.originalRoles[p.id]==='Werewolf').map(p=>p.name);
  if(fellow.length){
    round.info[playerId] = {
      title:'Your role: WEREWOLF',
      body: `Your fellow Werewolves: ${fellow.join(', ')}.`,
      note:'Try to blend in with the villagers during discussion.',
    };
  } else {
    const peekRole = round.center[round.wolfCenterPeekIndex];
    round.info[playerId] = {
      title:'Your role: WEREWOLF',
      body: `You're the only Werewolf among the players. You secretly peeked at one of the 3 cards in the middle: ${peekRole.toUpperCase()}.`,
      note:'Two more unseen cards are still hiding in the middle. Use what you saw to bluff convincingly.',
    };
  }
}

function resolveWWAction(playerId, role, selected){
  const round = S.round;
  const nameOf = id => S.players.find(p=>p.id===id).name;
  if(role==='Seer'){
    const targetId = selected[0];
    const targetRole = round.currentRoles[targetId];
    round.info[playerId] = {title:'Your role: SEER', body:`You peeked at ${nameOf(targetId)}'s role: ${targetRole.toUpperCase()}.`, note:'Remember this — it might be the most reliable info anyone has tonight.'};
  } else if(role==='Robber'){
    const targetId = selected[0];
    const tmp = round.currentRoles[playerId];
    round.currentRoles[playerId] = round.currentRoles[targetId];
    round.currentRoles[targetId] = tmp;
    round.nightLog.push(`${nameOf(playerId)} (Robber) swapped roles with ${nameOf(targetId)}.`);
    round.info[playerId] = {title:'Your role: ROBBER', body:`You swapped roles with ${nameOf(targetId)}. Your new role is ${round.currentRoles[playerId].toUpperCase()}.`, note:'You are now whatever you just became — even if that\'s the Werewolf.'};
  } else if(role==='Troublemaker'){
    const id1=selected[0], id2=selected[1];
    const tmp = round.currentRoles[id1];
    round.currentRoles[id1] = round.currentRoles[id2];
    round.currentRoles[id2] = tmp;
    round.nightLog.push(`${nameOf(playerId)} (Troublemaker) swapped ${nameOf(id1)} and ${nameOf(id2)}'s roles.`);
    round.info[playerId] = {title:'Your role: TROUBLEMAKER', body:`You swapped ${nameOf(id1)} and ${nameOf(id2)}'s roles.`, note:'You don\'t know what they became — and neither do they. They still think they\'re whoever they started as.'};
  }
}

function advanceWW(){
  S.revealIndex++;
  S.wwStage='intro'; S.wwSelected=[];
  if(S.revealIndex>=S.round.passOrder.length){
    finalizeWerewolfNight();
    S.screen='discussion';
  }
  render();
}

function finalizeWerewolfNight(){
  const round = S.round;
  const targets = S.players.filter(p=>round.currentRoles[p.id]==='Werewolf').map(p=>p.id);
  round.targets = targets; // internal only — not shown pre-vote, so this never spoils the outcome
  const startLines = S.players.map(p=>`${p.name}: ${round.originalRoles[p.id]}`).join(', ');
  const swapLines = round.nightLog.length ? round.nightLog.join(' ') : 'No roles were swapped tonight.';
  const finalLines = S.players.map(p=>`${p.name}: ${round.currentRoles[p.id]}`).join(', ');
  const centerLine = `The 3 cards left in the middle were: ${round.center.map(r=>r.toUpperCase()).join(', ')}.`;
  const wolfLine = targets.length===0
    ? `🕊️ Every Werewolf card ended up in the middle this round — no player was ever a Werewolf. It was a peaceful night; voting for nobody was correct.`
    : `🐺 ${targets.length>1?'The Werewolves were':'The Werewolf was'} ${targets.map(id=>S.players.find(p=>p.id===id).name).join(', ')}.`;
  round.revealNote = `Starting roles — ${startLines}\n\nDuring the night — ${swapLines}\n\n${centerLine}\n\nFinal roles — ${finalLines}\n\n${wolfLine}`;
}

SCREENS.wlnumber = function(){
  const s = el('div','screen');
  const round = S.round;
  const playerId = round.passOrder[S.revealIndex];
  const player = S.players.find(p=>p.id===playerId);
  const guesser = S.players.find(p=>p.id===round.guesserId);
  s.appendChild(topbar('Wavelength', null, (()=>{const d=el('div');d.textContent=`${S.revealIndex+1}/${round.passOrder.length}`;d.style.cssText='font-size:13px;color:var(--ink-faint);font-weight:700;';return d;})()));
  const wrap = el('div','pass-wrap');
  if(!S.wlNumRevealed){
    wrap.appendChild(el('div','pass-icon','🔢'));
    wrap.appendChild(el('div','eyebrow','Pass the phone to'));
    wrap.appendChild(el('div','pass-name', player.name));
    wrap.appendChild(el('div','pass-hint', `Make sure ${guesser.name} can't see.`));
    const tap = el('button','btn btn-primary', `I\'m ${player.name} — Reveal the number`); tap.style.marginTop='10px';
    tap.onclick=()=>{ sfx.flip(); S.wlNumRevealed=true; S.wlHoldDone=false; render(); };
    wrap.appendChild(tap);
  } else if(!S.wlHoldDone){
    wrap.appendChild(el('div','eyebrow','🔒 Secret Number'));
    wrap.appendChild(el('div','pass-hint','Make sure nobody else is looking.'));
    const holdWrap = el('div'); holdWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px;';
    const hb = el('div','hold-btn');
    hb.innerHTML = `<svg viewBox="0 0 100 100"><circle class="bg-ring" cx="50" cy="50" r="44"></circle><circle class="fg-ring" cx="50" cy="50" r="44" stroke-dasharray="276" stroke-dashoffset="276"></circle></svg><div class="hold-label">HOLD TO<br>REVEAL</div>`;
    let holding=false, holdTimer=null, startT=null; const DURATION=900;
    const ring = hb.querySelector('.fg-ring');
    function step(ts){
      if(!startT) startT=ts;
      const p = Math.min(1,(ts-startT)/DURATION);
      ring.setAttribute('stroke-dashoffset', 276*(1-p));
      if(p<1 && holding){ holdTimer=requestAnimationFrame(step); }
      else if(p>=1){ finish(); }
    }
    function finish(){ holding=false; sfx.reveal(); S.wlHoldDone=true; render(); }
    function startHold(e){ e.preventDefault(); holding=true; hb.classList.add('active'); startT=null; holdTimer=requestAnimationFrame(step); }
    function endHold(){ holding=false; hb.classList.remove('active'); ring.setAttribute('stroke-dashoffset',276); cancelAnimationFrame(holdTimer); }
    hb.addEventListener('touchstart',startHold,{passive:false});
    hb.addEventListener('touchend',endHold);
    hb.addEventListener('touchcancel',endHold);
    hb.addEventListener('mousedown',startHold);
    hb.addEventListener('mouseup',endHold);
    hb.addEventListener('mouseleave',endHold);
    holdWrap.appendChild(hb);
    wrap.appendChild(holdWrap);
  } else {
    wrap.appendChild(el('div','eyebrow','🔒 SECRET NUMBER'));
    const big = el('div'); big.style.cssText='font-size:76px;font-weight:700;font-family:Space Grotesk,sans-serif;color:var(--violet-2);margin:6px 0;';
    big.textContent = round.number;
    wrap.appendChild(big);
    wrap.appendChild(el('div','pass-hint', `Remember this. Everyone except ${guesser.name} knows this same number — nothing else.`));
    const done = el('button','btn btn-danger','Hide & Pass →'); done.style.marginTop='14px';
    done.onclick=()=>{
      sfx.tick();
      S.revealIndex++;
      S.wlNumRevealed=false; S.wlHoldDone=false;
      if(S.revealIndex>=round.passOrder.length){ S.screen='wlprompt'; }
      render();
    };
    wrap.appendChild(done);
  }
  s.appendChild(wrap);
  app.appendChild(s);
};

let timerInterval=null;
function stopTimerLoop(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function runTimerLoop(){
  stopTimerLoop();
  timerInterval = setInterval(()=>{
    S.remainingSec--;
    if(S.remainingSec<=5 && S.remainingSec>0) sfx.tick();
    if(S.remainingSec<=0){
      S.remainingSec=0; S.timerRunning=false; stopTimerLoop(); sfx.dramatic();
      S.screen='votepass'; S.voteIndex=0; S.votes={};
      render(); return;
    }
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const num = document.getElementById('tnum'); if(!num) return;
  const m = Math.floor(S.remainingSec/60), sec = S.remainingSec%60;
  num.textContent = `${m}:${sec.toString().padStart(2,'0')}`;
  const frac = S.remainingSec / S.discussionSeconds;
  const circumference = 628;
  const fg = document.querySelector('.timer-fg');
  if(fg){
    fg.setAttribute('stroke-dashoffset', (circumference*(1-frac)).toFixed(1));
    fg.classList.remove('warn','crit');
    if(frac<0.15) fg.classList.add('crit'); else if(frac<0.4) fg.classList.add('warn');
  }
}
function showSpiceFlash(spice){

  ok.onclick=()=>{ flash.remove(); render(); };
  flash.appendChild(ok);

}

      const av = el('div','avatar','🤷'); av.style.background='linear-gradient(135deg,var(--ink-faint),var(--line))';
      opt.appendChild(av);
      const nm = el('div',null,'Nobody — peaceful night'); nm.style.flex='1'; opt.appendChild(nm);
      if(S.tmpVote==='NOBODY') opt.appendChild(el('div',null,'✓'));
      opt.onclick=()=>{ sfx.tick(); S.tmpVote='NOBODY'; render(); };
      list.appendChild(opt);
    }
    s.appendChild(list);
    const spacer=el('div'); spacer.style.flex='1'; s.appendChild(spacer);
    const lock = el('button','btn btn-danger', S.tmpVote? 'Lock In Vote 🔒' : 'Select a player');
    lock.disabled = !S.tmpVote;
    lock.onclick=()=>{
      sfx.lock();
      S.votes[voter.id]=S.tmpVote;
      S.tmpVote=null; S.votingNow=false;
      S.voteIndex++;
      if(S.voteIndex>=S.players.length){ S.screen='voteresult'; }
      render();
    };
    s.appendChild(lock);
  }
  app.appendChild(s);
};

/* ---- Vote results + reveal ---- */
SCREENS.voteresult = function(){
  const s = el('div','screen');
  s.appendChild(topbar('Results', null));
  s.appendChild(el('h2','title','Votes are in'));

  const tally={}; S.players.forEach(p=>tally[p.id]=0);
  if(S.round.allowSkipVote) tally['NOBODY']=0;
  Object.values(S.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const maxVotes = Math.max(0,...Object.values(tally));
  const topVoted = Object.keys(tally).filter(id=>tally[id]===maxVotes && maxVotes>0);

  const card = el('div','card'); card.style.marginBottom='16px';
  S.players.slice().sort((a,b)=>tally[b.id]-tally[a.id]).forEach((p,i)=>{
    const row = el('div','result-row');
    row.appendChild(avatarEl(p.name,i));
    const nm = el('div',null,p.name); nm.style.cssText='width:88px;font-weight:600;font-size:14px;flex-shrink:0;';
    row.appendChild(nm);
    const barBg = el('div','result-bar-bg'); const barFg=el('div','result-bar-fg');
    barFg.style.width = maxVotes? `${(tally[p.id]/maxVotes)*100}%` : '0%';
    barBg.appendChild(barFg); row.appendChild(barBg);
    row.appendChild(el('div',null,tally[p.id])).style.cssText='font-weight:700;width:18px;text-align:right;';
    card.appendChild(row);
  });
  if(S.round.allowSkipVote){
    const row = el('div','result-row');
    const av = el('div','avatar','🤷'); av.style.background='linear-gradient(135deg,var(--ink-faint),var(--line))';
    row.appendChild(av);
    const nm = el('div',null,'Nobody'); nm.style.cssText='width:88px;font-weight:600;font-size:14px;flex-shrink:0;';
    row.appendChild(nm);
    const barBg = el('div','result-bar-bg'); const barFg=el('div','result-bar-fg');
    barFg.style.width = maxVotes? `${(tally['NOBODY']/maxVotes)*100}%` : '0%';
    barBg.appendChild(barFg); row.appendChild(barBg);
    row.appendChild(el('div',null,tally['NOBODY'])).style.cssText='font-weight:700;width:18px;text-align:right;';
    card.appendChild(row);
  }
  s.appendChild(card);

  const reveal = el('button','btn btn-primary','Reveal the truth →');
  reveal.onclick=()=>{
    sfx.dramatic();
    applyScoring(topVoted);
    const round = S.round;
    if(round.caught && round.redemption && round.targets.length>0){
      S.redemptionQueue = round.targets.slice();
      S.redemptionIndex = 0;
      S.redemptionChoice = null;
      S.redemptionRevealed = false;
      S.screen='redemption';
    } else {
      S.screen='roundresult';
    }
    render();
  };
  s.appendChild(reveal);
  app.appendChild(s);
};

SCREENS.redemption = function(){
  const s = el('div','screen');
  const round = S.round;
  const targetId = S.redemptionQueue[S.redemptionIndex];
  const player = S.players.find(p=>p.id===targetId);
  s.appendChild(topbar('Last Chance', null));

  if(!S.redemptionRevealed){
    const wrap = el('div','pass-wrap');
    wrap.appendChild(el('div','pass-icon','🎲'));
    wrap.appendChild(el('div','eyebrow','Pass the phone to'));
    wrap.appendChild(el('div','pass-name', player.name));
    wrap.appendChild(el('div','pass-hint','You were caught — but you get one shot to guess right and win anyway.'));
    const tap = el('button','btn btn-primary', `I\'m ${player.name} — Take my shot`); tap.style.marginTop='10px';
    tap.onclick=()=>{ sfx.flip(); S.redemptionRevealed=true; render(); };
    wrap.appendChild(tap);
    s.appendChild(wrap);
  } else {
    s.appendChild(el('h2','title','Last Chance'));
    s.appendChild(el('p','sub', round.redemption.question));
    const list = el('div','stack');
    round.redemption.options.forEach(opt=>{
      const btn = el('button','vote-option'+(S.redemptionChoice===opt?' chosen':''), opt);
      btn.style.textAlign='left';
      btn.onclick=()=>{ sfx.tick(); S.redemptionChoice=opt; render(); };
      list.appendChild(btn);
    });
    s.appendChild(list);
    const spacer=el('div'); spacer.style.flex='1'; s.appendChild(spacer);
    const confirm = el('button','btn btn-danger', S.redemptionChoice? 'Lock In Answer' : 'Pick an answer');
    confirm.disabled = !S.redemptionChoice;
    confirm.onclick=()=>{
      sfx.lock();
      const correct = S.redemptionChoice === round.redemption.correct;
      round.redemptionResults = round.redemptionResults || {};
      round.redemptionResults[targetId] = correct;
      if(correct){ S.score[targetId] = (S.score[targetId]||0)+5; }
      S.redemptionIndex++;
      S.redemptionRevealed = false; S.redemptionChoice = null;
      if(S.redemptionIndex>=S.redemptionQueue.length){ S.screen='roundresult'; }
      render();
    };
    s.appendChild(confirm);
  }
  app.appendChild(s);
};

function applyScoring(topVoted){
  const round=S.round;
  const targets = round.targets;
  if(targets.length===0){
    // Peaceful night (werewolf mode only): correct answer is voting "Nobody".
    round.caught = topVoted.length===1 && topVoted[0]==='NOBODY';
    round.topVoted = topVoted;
    Object.entries(S.votes).forEach(([voterId,voteVal])=>{
      if(voteVal==='NOBODY'){ S.score[voterId]=(S.score[voterId]||0)+3; stats.correctAccusations++; }
    });
    stats.roundsPlayed++;
    stats.curStreak = round.caught? stats.curStreak+1 : 0;
    stats.bestStreak = Math.max(stats.bestStreak, stats.curStreak);
    saveStats();
    return;
  }
  const caught = targets.some(t=>topVoted.includes(t)) && topVoted.length===1;
  round.caught = caught;
  round.topVoted = topVoted;
  // voters who correctly voted for a target get points
  Object.entries(S.votes).forEach(([voterId,targetId])=>{
    if(targets.includes(targetId)){
      S.score[voterId] = (S.score[voterId]||0)+3;
      stats.correctAccusations++;
    }
  });
  // target(s): bonus if not caught (survived)
  targets.forEach(tid=>{
    if(!caught){ S.score[tid]=(S.score[tid]||0)+4; stats.successfulBluffs++; }
    else { stats.timesVotedOut++; }
  });
  stats.roundsPlayed++;
  stats.curStreak = caught? 0 : stats.curStreak+1;
  stats.bestStreak = Math.max(stats.bestStreak, stats.curStreak);
  saveStats();
}

SCREENS.roundresult = function(){
  const s = el('div','screen');
  s.appendChild(topbar('Reveal', null));
  const round = S.round;
  s.appendChild(el('div','tag-truth', round.modeName));
  const peaceful = round.mode==='werewolf' && round.targets.length===0;
  let heading;
  if(peaceful){ heading = round.caught ? '🕊️ Peaceful Night — Well Read!' : '🌙 It Was Peaceful — Nobody Guessed It'; }
  else { heading = round.caught ? '🎯 Caught!' : '😈 They got away with it.'; }
  s.appendChild(el('h2','title', heading));

  const card = el('div','card card-glow'); card.style.marginBottom='14px';
  card.innerHTML = `<div style="white-space:pre-line;font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:10px;">${round.revealNote}</div>`;
  if(round.targets.length>0){
    const targetNames = round.targets.map(id=>S.players.find(p=>p.id===id).name).join(', ');
    card.appendChild(el('div','tag-target', `${round.targetLabel}: ${targetNames}`));
  } else if(peaceful){
    card.appendChild(el('div','tag-target', 'No Werewolf was in play this round'));
  }
  s.appendChild(card);

  if(round.redemptionResults && Object.keys(round.redemptionResults).length){
    const rcard = el('div','card'); rcard.style.marginBottom='16px';
    rcard.appendChild(el('div',null,'Last chance results:')).style.cssText='font-weight:700;margin-bottom:8px;font-family:Space Grotesk,sans-serif;';
    Object.entries(round.redemptionResults).forEach(([pid,correct])=>{
      const name = S.players.find(p=>p.id===pid).name;
      const row = el('div'); row.style.cssText='font-size:13px;color:var(--ink-dim);margin-bottom:4px;';
      row.textContent = correct ? `🎲 ${name} guessed right and escaped anyway! (+5)` : `🎲 ${name} guessed wrong — stayed caught.`;
      rcard.appendChild(row);
    });
    s.appendChild(rcard);
  }

  // per-player info recap
  const recap = el('div','card'); recap.style.marginBottom='16px';
  recap.appendChild(el('div',null,'What everyone had:')).style.cssText='font-weight:700;margin-bottom:10px;font-family:Space Grotesk,sans-serif;';
  S.players.forEach((p,i)=>{
    const info = round.info[p.id];
    const row = el('div'); row.style.cssText='margin-bottom:10px;font-size:13px;line-height:1.5;';
    row.innerHTML = `<b style="color:var(--violet-2)">${p.name}:</b> <span style="color:var(--ink-dim)">${info.body}</span>`;
    recap.appendChild(row);
  });
  s.appendChild(recap);

  const cont = el('button','btn btn-primary','See Scoreboard →');
  cont.onclick=()=>{ sfx.win(); S.screen='scoreboard'; render(); };
  s.appendChild(cont);
  app.appendChild(s);
};

SCREENS.scoreboard = function(){
  const s = el('div','screen');
  s.appendChild(topbar('Scoreboard', null));
  s.appendChild(el('h2','title','🏆 Scoreboard'));

  const card = el('div','card');
  S.players.slice().sort((a,b)=>(S.score[b.id]||0)-(S.score[a.id]||0)).forEach((p,i)=>{
    const row = el('div','scoreboard-row');
    row.appendChild(el('div',null, i===0?'👑':`${i+1}`)).style.cssText='width:22px;text-align:center;color:var(--ink-faint);font-weight:700;';
    row.appendChild(avatarEl(p.name,i));
    const nm = el('div',null,p.name); nm.style.cssText='flex:1;font-weight:600;'; row.appendChild(nm);
    row.appendChild(el('div','score-num', S.score[p.id]||0));
    card.appendChild(row);
  });
  s.appendChild(card);

  const spacer=el('div'); spacer.style.flex='1'; s.appendChild(spacer);
  const btns = el('div','stack');
  const again = el('button','btn btn-primary','🔁 Next Round');
  again.onclick=()=>{ sfx.flip(); resetForNextRound(); startPassPhase(); };

  end.onclick=()=>{ sfx.tick(); stats.gamesPlayed++; saveStats(); S.screen='menu'; resetGameState(); render(); };
  btns.appendChild(again); btns.appendChild(end);
  s.appendChild(btns);
  app.appendChild(s);
};

function resetForNextRound(){
  S.revealed={}; S.revealIndex=0; S.votes={}; S.voteIndex=0; S.remainingSec=null;
  S.timerRunning=false; S.timerStarted=false; S.spiceShown=false; S.tmpVote=null;
  S.revealedNow=false; S.revealedShown=false; S.wwStage='intro'; S.wwSelected=[];
  S.redemptionQueue=[]; S.redemptionIndex=0; S.redemptionChoice=null; S.redemptionRevealed=false;
  S.wlGuess=null; S.wlScored=false; S.wlNumRevealed=false; S.wlHoldDone=false;
  stopTimerLoop();
}
function resetGameState(){
  resetForNextRound(); S.players=[]; S.score={}; S.round=null; S.selectedMode=null; S.wlLastGuesserId=null;
}

/* ---- How to play ---- */
const TUTORIAL = [
  {emoji:'✍️', title:'1. Enter Names', body:'Everyone playing enters their name on one phone.'},
  {emoji:'📱', title:'2. Pass the Phone', body:'Tap your name, hold to reveal your secret. Make sure nobody else looks.'},
  {emoji:'🗣️', title:'3. Talk', body:'Figure out who knows the truth, who\'s bluffing, and what the secret actually is.'},
  {emoji:'🗳️', title:'4. Vote', body:'Pass the phone again. Everyone votes secretly for who they suspect.'},
  {emoji:'🎉', title:'5. Reveal', body:'Find out who was lying, who was wrong, and who played everyone.'},
];
SCREENS.howto = function(){
  const s = el('div','screen');

  body.appendChild(el('p','sub', slide.body));

};

/* ---- Stats ---- */
SCREENS.stats = function(){
  const s = el('div','screen');
  s.appendChild(topbar('Stats', ()=>{ S.screen='menu'; render(); }));
  s.appendChild(el('h2','title','🏅 Your Stats'));

  const grid = el('div','stat-grid');
  const items = [
    [stats.gamesPlayed,'Games Played'], [stats.roundsPlayed,'Rounds Played'],
    [stats.correctAccusations,'Correct Accusations'], [stats.successfulBluffs,'Successful Bluffs'],
    [stats.timesVotedOut,'Times Caught'], [stats.bestStreak,'Best Streak'],
  ];
  items.forEach(([n,l])=>{
    const box = el('div','stat-box');
    box.innerHTML = `<div class="stat-num">${n}</div><div class="stat-label">${l}</div>`;
    grid.appendChild(box);
  });
  s.appendChild(grid);

  const titleCard = el('div','card'); titleCard.style.marginTop='16px';
  let title='🎲 GETTING STARTED', desc='Play a few rounds to earn a title.';
  if(stats.roundsPlayed>=3){
    if(stats.successfulBluffs > stats.timesVotedOut && stats.successfulBluffs>=3){ title='🐍 THE SNAKE'; desc='Most successful bluffs. Nobody can catch you.'; }
    else if(stats.correctAccusations>=5){ title='👁️ HUMAN LIE DETECTOR'; desc='You call out liars better than most.'; }
    else if(stats.timesVotedOut>=3 && stats.timesVotedOut>stats.successfulBluffs){ title='🤡 PROFESSIONAL VICTIM'; desc='Most times incorrectly — or correctly — voted out.'; }
    else { title='🕵️ SOLID DEDUCER'; desc='Keep playing to unlock a sharper title.'; }
  }
  titleCard.innerHTML = `<div class="eyebrow">Your title</div><div style="font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${title}</div><div style="font-size:13px;color:var(--ink-dim)">${desc}</div>`;
  s.appendChild(titleCard);

  const spacer=el('div'); spacer.style.flex='1'; s.appendChild(spacer);
  const reset = el('button','btn-ghost','Reset stats');
  reset.onclick=()=>{
    if(confirm('Reset all stats?')){
      stats={gamesPlayed:0,roundsPlayed:0,correctAccusations:0,successfulBluffs:0,timesVotedOut:0,bestStreak:0,curStreak:0};
      saveStats(); render();
    }
  };
  s.appendChild(reset);
  app.appendChild(s);
};
